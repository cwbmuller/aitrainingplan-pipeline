<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aitrainingplan pipeline: plan viewer</title>
<style>
  :root { --bg: #0b0f17; --panel: #111827; --line: #1f2937; --text: #e5e7eb; --muted: #9ca3af; --accent: #3b82f6; --hard: #f87171; --soft: #fbbf24; --ok: #34d399; --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .sub a { color: var(--accent); text-decoration: none; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tabs button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px; }
  .tabs button.on { border-color: var(--accent); color: var(--text); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; }
  .head h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .head .goal { color: var(--muted); }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); }
  .pill.accent { border-color: var(--accent); color: var(--accent); }
  .summary { margin: 14px 0 0; color: var(--text); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-family: var(--mono); font-size: 15px; margin-top: 2px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .day { border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 150px; display: flex; flex-direction: column; gap: 6px; }
  .day.rest { opacity: .55; }
  .day.hard { border-color: var(--hard); }
  .day .d { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .day .t { font-weight: 600; font-size: 14px; }
  .day .m { font-family: var(--mono); font-size: 22px; }
  .day .m small { font-size: 12px; color: var(--muted); margin-left: 2px; }
  .day .ty { font-size: 12px; color: var(--muted); }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  .detail p { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .detail b { color: var(--text); font-weight: 600; }
  .judge .verdict { font-family: var(--mono); font-size: 14px; margin-bottom: 8px; }
  .judge .verdict span { color: var(--accent); }
  .judge p { margin: 8px 0; color: var(--text); }
  .judge .fix { color: var(--muted); }
  .trail li { font-family: var(--mono); font-size: 13px; margin: 4px 0; color: var(--muted); }
  .trail li b { color: var(--text); font-weight: 500; }
  .trail .hard { color: var(--hard); } .trail .soft { color: var(--soft); } .trail .clean { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 4px; }
  .links a { color: var(--accent); text-decoration: none; }
  .err { color: var(--hard); }
  @media (max-width: 860px) { .week { grid-template-columns: repeat(2, 1fr); } .day { min-height: 0; } }
</style>
</head>
<body>
<main>
  <h1>aitrainingplan pipeline</h1>
  <p class="sub">One certified week per athlete, generated by the pipeline in <a href="https://github.com/cwbmuller/aitrainingplan-pipeline">cwbmuller/aitrainingplan-pipeline</a>. This page reads the published <code>out/</code> files, nothing here is hand-edited.</p>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<script>
const ATHLETES = ['marathon-10wk', 'cyclist-taper', 'gym-beginner'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tabs = document.getElementById('tabs');
const view = document.getElementById('view');

async function load(id) {
  for (const b of tabs.children) b.classList.toggle('on', b.dataset.id === id);
  history.replaceState(null, '', '#' + id);
  view.innerHTML = '<p class="sub">Loading…</p>';
  try {
    const [pj, rl] = await Promise.all([
      fetch(`out/${id}/plan.json`).then((r) => r.json()),
      fetch(`out/${id}/run-log.json`).then((r) => r.json()),
    ]);
    render(id, pj.contract, pj.plan, rl);
  } catch (e) {
    view.innerHTML = `<p class="err">Could not load out/${esc(id)}: ${esc(e.message)}</p>`;
  }
}

function render(id, c, p, log) {
  const total = p.days.reduce((a, d) => a + d.minutes, 0);
  const hard = p.days.filter((d) => d.intensity === 'hard').length;
  const longest = Math.max(...p.days.map((d) => d.minutes));
  const pct = Math.min(100, Math.round((total / c.max_weekly_minutes) * 100));
  const j = log.judge && log.judge.verdict;
  const stages = (log.stages || []).map((s) => {
    const cls = /\[hard\]/.test(s.result) ? 'hard' : /\[soft\]/.test(s.result) ? 'soft' : /clean/.test(s.result) ? 'clean' : '';
    return `<li><b>${esc(s.stage)}</b>: <span class="${cls}">${esc(s.result)}</span></li>`;
  }).join('');
  const calls = (log.calls || []).map((k) => {
    const u = k.usage || {};
    const tokens = u.totalTokenCount ?? u.total_tokens ?? '';
    return `<tr><td>${esc(k.stage)}</td><td>${esc(k.model)}</td><td>${(k.ms / 1000).toFixed(1)} s</td><td>${esc(tokens)}</td></tr>`;
  }).join('');

  view.innerHTML = `
  <div class="card">
    <div class="head"><h2>${esc(c.name)} <span class="goal">· ${esc(c.sport)}</span></h2><div class="goal">${esc(c.goal)}</div></div>
    <div class="pills">
      ${c.days_out !== null && c.days_out !== undefined ? `<span class="pill${c.taper ? ' accent' : ''}">${c.days_out} days out${c.taper ? ' · taper' : ''}</span>` : ''}
      <span class="pill">cap ${c.max_weekly_minutes} min</span>
      <span class="pill">max hard ${c.max_hard_sessions}</span>
      <span class="pill">4-wk avg ${c.recent_avg_minutes} min</span>
      <span class="pill">longest recent ${c.longest_recent_session_minutes} min</span>
      ${(c.injuries || []).map((i) => `<span class="pill">${esc(i)}</span>`).join('')}
    </div>
    <p class="summary">${esc(p.week_summary)}</p>
    <div class="stats">
      <div class="stat"><div class="k">Week total vs cap</div><div class="v">${total} / ${c.max_weekly_minutes} min</div><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="stat"><div class="k">Hard sessions</div><div class="v">${hard} of ${c.max_hard_sessions} allowed</div></div>
      <div class="stat"><div class="k">Longest session</div><div class="v">${longest} min · ${Math.round((longest / total) * 100)}% of week</div></div>
      <div class="stat"><div class="k">Source</div><div class="v">${esc(log.source)}</div></div>
    </div>
  </div>

  <div class="card">
    <div class="week">
      ${p.days.map((d) => `
        <div class="day ${d.type === 'rest' ? 'rest' : ''} ${d.intensity === 'hard' ? 'hard' : ''}">
          <div class="d"><span>${esc(d.day)}</span><span>${esc(d.intensity)}</span></div>
          <div class="m">${d.minutes}<small>min</small></div>
          <div class="t">${esc(d.title)}</div>
          <div class="ty">${esc(d.type)}</div>
        </div>`).join('')}
    </div>
    <details>
      <summary>Session detail</summary>
      <div class="detail">
        ${p.days.filter((d) => d.minutes > 0).map((d) => `<p><b>${esc(d.day)} · ${esc(d.title)}</b> (${d.minutes} min, ${esc(d.intensity)}). ${esc(d.purpose)} <br>${esc(d.structure)}</p>`).join('')}
      </div>
    </details>
  </div>

  <div class="card judge">
    <div class="verdict">Coach's eye (advisory, ${esc(log.judge ? log.judge.vendor : 'none')}): ${j ? `<span>${esc(j.verdict)}</span> ${esc(j.overall)}/5` : '<span>no verdict</span>'}</div>
    ${j ? `<p>${esc(j.assessment)}</p><p class="fix">Top fix: ${esc(j.top_fix)}</p>` : `<p class="fix">${esc(log.judge && log.judge.error)}</p>`}
  </div>

  <div class="card trail">
    <div class="verdict">Certification trail · ${esc(log.designer_model)} · ${((log.total_ms || 0) / 1000).toFixed(1)} s end to end</div>
    <ul>${stages}</ul>
    ${calls ? `<table><thead><tr><th>call</th><th>model</th><th>latency</th><th>tokens</th></tr></thead><tbody>${calls}</tbody></table>` : ''}
    <div class="links" style="margin-top:14px">
      <a href="out/${id}/plan.md">plan.md</a>
      <a href="out/${id}/plan.ics">plan.ics (calendar)</a>
      <a href="out/${id}/plan.json">plan.json</a>
      <a href="out/${id}/run-log.json">run-log.json</a>
      ${id === 'cyclist-taper' ? '<a href="out/cyclist-taper/recertify-first-pass.json">recertify-first-pass.json</a>' : ''}
    </div>
  </div>`;
}

for (const id of ATHLETES) {
  const b = document.createElement('button');
  b.textContent = id; b.dataset.id = id; b.onclick = () => load(id);
  tabs.appendChild(b);
}
const fromHash = () => { const h = location.hash.slice(1); load(ATHLETES.includes(h) ? h : ATHLETES[0]); };
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
