# The recurring shape: regenerate every athlete's week each Sunday and commit the outputs.
# Runs only if the repo has the two API secrets; otherwise the job is skipped, never half-run.
name: weekly-plans
on:
  schedule: [{ cron: '0 5 * * 0' }]
  workflow_dispatch:
jobs:
  plans:
    if: ${{ secrets.GEMINI_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node src/run.mjs --all
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: |
          git config user.name plans-bot && git config user.email plans-bot@users.noreply.github.com
          git add out && git commit -m "weekly plans $(date -u +%F)" || echo "no changes"
          git push
