# The recurring shape: regenerate every athlete's week each Sunday and commit the outputs.
# Runs only if the repo has the two API secrets; otherwise every step is skipped (secrets cannot be read in a job-level if).
name: weekly-plans
on:
  schedule: [{ cron: '0 5 * * 0' }]
  workflow_dispatch:
jobs:
  plans:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check secrets
        id: keys
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; echo "No API secrets set, skipping."; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.present == 'true'
        with: { node-version: 22 }
      - run: node src/run.mjs --all
        if: steps.keys.outputs.present == 'true'
      - if: steps.keys.outputs.present == 'true'
        run: |
          git config user.name plans-bot && git config user.email plans-bot@users.noreply.github.com
          git add out && git commit -m "weekly plans $(date -u +%F)" || echo "no changes"
          git push
